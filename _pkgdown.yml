url: https://certe-medical-epidemiology.github.io/EpiSODIC/

template:
  bootstrap: 5
  bootswatch: yeti
  bslib:
    # Match the app's own typeface (--episodic-font in
    # inst/app/www/episodic.css, loaded the same way in R/app_ui.R).
    base_font: {google: "IBM Plex Sans"}

navbar:
  type: dark

articles:
- title: Get started
  desc: >
    What EpiSODIC does, and the fastest path from nothing to a working
    instance.
  contents:
  - overview
  - data-format
  - deployment

- title: Reference
  desc: >
    Look these up as needed rather than reading start to finish.
  contents:
  - environment-variables
  - detection-reconciliation
  - faq

reference:
- title: Try it out
  desc: >
    The fastest way to see what EpiSODIC does, with no data or
    configuration of your own required.
  contents:
  - episodic_demo

- title: Run EpiSODIC
  desc: >
    The two calls that run a real instance: detect on a schedule, and
    open the dashboard for your board to review the results.
  contents:
  - episodic_run_cron
  - episodic_run_app
  - episodic_resolve_data

- title: Connect your own data
  desc: >
    How to plug in your laboratory results and, optionally, testing
    volume and hospital activity data - and how to check your extract
    against the contract before you run anything.
  contents:
  - episodic_case_data
  - episodic_check_cases
  - episodic_validate_cases
  - episodic_synthetic_cases
  - episodic_synthetic_cases_calibration
  - episodic_synthetic_denominators
  - episodic_synthetic_institution_activity

- title: Set up a database
  desc: >
    Create and connect to the database EpiSODIC stores its data in.
  contents:
  - episodic_db_create
  - episodic_db_connect
  - episodic_db_open
  - episodic_db_dsn_mariadb

- title: Accounts and sign-in
  contents:
  - episodic_auth
  - episodic_provision_user

- title: Configure detection
  desc: >
    Detection thresholds, priority scoring, and reproducibility.
  contents:
  - episodic_config_resolve
  - episodic_config_hash

- title: Interpret and report results
  desc: >
    How the dashboard's narrative summary is generated, and how to send
    an outbreak report to clinical colleagues.
  contents:
  - episodic_interpretation
  - episodic_report_render

- title: Customise the look and feel
  desc: >
    House colours, maps, translations, and dashboard chart building
    blocks - useful if you are adapting EpiSODIC or writing your own
    report template.
  contents:
  - episodic_palette
  - episodic_geo
  - i18n
  - episodic_tr
  - episodic_charts
  - episodic_ui_italicise_taxon

