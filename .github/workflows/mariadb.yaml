# The suite against a real MariaDB server.
#
# EpiSODIC stores its data in SQLite or in MariaDB/MySQL, and the second
# dialect is produced by rewriting the first: episodic_db_schema_statements()
# turns inst/sql/schema.sql into MySQL-safe DDL with a hand-maintained
# per-table find-and-replace table. Everything about that was checked by
# reading the strings it produced. Nothing checked that a server would
# accept them, and the first time one was asked, it did not.
#
# Two servers, not one, and not the five-way OS matrix in
# R-CMD-check.yaml. The dialect adapter is a property of the package
# rather than of the platform it runs on, so one Linux job per server is
# enough - but MariaDB and MySQL are genuinely different servers here, and
# testing only one hid a real defect for the life of the package. MariaDB
# honours an inline column-level REFERENCES and refuses a table whose
# parent does not exist yet; MySQL parses the same clause and throws it
# away, so a schema that relied on inline references got every table and
# not one constraint there, silently.
#
# To run these locally instead, against either server:
#
#   docker run -d --name episodic-mariadb -p 13306:3306 \
#     -e MARIADB_ROOT_PASSWORD=episodic -e MARIADB_DATABASE=episodic_test \
#     -e MARIADB_USER=episodic -e MARIADB_PASSWORD=episodic mariadb:11
#   docker run -d --name episodic-mysql -p 13308:3306 \
#     -e MYSQL_ROOT_PASSWORD=episodic -e MYSQL_DATABASE=episodic_test \
#     -e MYSQL_USER=episodic -e MYSQL_PASSWORD=episodic mysql:8
#   EPISODIC_TEST_MARIADB_DSN=mysql://episodic:episodic@127.0.0.1:13306/episodic_test \
#     Rscript -e 'devtools::test()'
#
# Point it at a scratch database and nothing else: every test in
# tests/testthat/test-mariadb_live.R begins by dropping every EpiSODIC
# table it finds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: mariadb.yaml

permissions: read-all

jobs:
  server:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release) with ${{ matrix.server.name }}

    strategy:
      fail-fast: false
      matrix:
        server:
          # The health check differs per image: MariaDB ships its own
          # script, and `mariadb-admin ping` would not do - ping answers
          # as soon as a server responds on the socket, which the
          # entrypoint's temporary initialisation server does before the
          # database and user below exist. A job that started connecting
          # then would fail on its first statement, at random, and look
          # like a schema problem.
          - name: MariaDB 11
            image: mariadb:11
            health: healthcheck.sh --connect --innodb_initialized
          - name: MySQL 8
            image: mysql:8
            health: mysqladmin ping -h 127.0.0.1 --silent

    services:
      database:
        image: ${{ matrix.server.image }}
        # Both images ignore the other's variables, so one block serves
        # both.
        env:
          MARIADB_ROOT_PASSWORD: episodic
          MARIADB_DATABASE: episodic_test
          MARIADB_USER: episodic
          MARIADB_PASSWORD: episodic
          MYSQL_ROOT_PASSWORD: episodic
          MYSQL_DATABASE: episodic_test
          MYSQL_USER: episodic
          MYSQL_PASSWORD: episodic
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.server.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=30s

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Credentials for a throwaway container that exists for the length
      # of this job and holds nothing but synthetic cases. The live tests
      # skip themselves when this is unset, which is what keeps the suite
      # green on a laptop with no MariaDB.
      EPISODIC_TEST_MARIADB_DSN: mysql://episodic:episodic@127.0.0.1:3306/episodic_test

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::RMariaDB, any::testthat, any::devtools
          needs: check

      # The shipped report template opens with library(EpiSODIC), and
      # quarto renders it in a subprocess, so that render needs the
      # package installed - not merely loaded from source by
      # testthat::test_local(). Without this the report test passed or
      # failed on whether a stale copy happened to be in the runner's
      # cache, which made one matrix leg fail and the other pass on the
      # same commit.
      - name: Install the package, so the report template can library() it
        run: R CMD INSTALL .

      # The whole suite, not only the MariaDB tests: a change that breaks
      # the dialect adapter and something else besides should report both.
      - name: Run the test suite against ${{ matrix.server.name }}
        run: |
          Rscript -e 'stopifnot(requireNamespace("RMariaDB", quietly = TRUE))'
          Rscript -e 'testthat::test_local(stop_on_failure = TRUE)'

      # A skipped MariaDB test in this job is a job that proved nothing.
      # It is the exact failure this workflow exists to prevent, so it
      # fails the build rather than passing quietly.
      - name: Refuse a run in which the live tests skipped themselves
        run: |
          Rscript -e '
            suppressMessages(pkgload::load_all(quiet = TRUE))
            results <- testthat::test_file(
              "tests/testthat/test-mariadb_live.R",
              reporter = "silent"
            )
            skipped <- sum(vapply(results, function(f) {
              sum(vapply(f$results, function(r) inherits(r, "expectation_skip"), logical(1)))
            }, integer(1)))
            if (skipped > 0) {
              stop(skipped, " live MariaDB test(s) skipped - the server was not reachable.")
            }
            cat("live MariaDB tests all ran\n")
          '
