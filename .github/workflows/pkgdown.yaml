on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # pkgdown renders every top-level .md file and has no option to
      # exclude one, and CLAUDE.md is development instructions, not
      # package documentation. The checkout is discarded after the job.
      - name: Keep CLAUDE.md off the site
        run: rm -f CLAUDE.md

      # clean = TRUE empties docs/ first, and the deploy step's own
      # `clean: true` removes from gh-pages whatever this build did not
      # produce, so a renamed or removed page never lingers.
      - name: Build site
        run: |
          pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE, clean = TRUE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: true
          branch: gh-pages
          folder: docs
