# EpiSODE's shipped default UI palette.
#
# Deliberately a separate file from default.yaml: this is a display-only
# concern (the app's colours), not part of detection configuration, so it
# must never affect episode_config_hash()/config_snapshot (ARCHITECTURE.md
# section 7.4-7.5's reproducibility guarantee is about detection results,
# not colour swatches). Resolved the same way: this file's values are the
# defaults, an operator overrides them by pointing EPISODE_PALETTE_CONFIG
# at their own YAML with only the keys they want to change - any
# organisation can run EpiSODE in its own house colours without installing
# certestyle (Certe-internal; QUESTIONS.md item 22).
#
# If certestyle IS installed, its colours are used instead of this file's
# values - see episode_palette_from_certestyle() in R/app_palette.R.
#
# Each hue has a base tone and, where the UI needs one, darker/lighter/
# paler steps for text-on-tint contrast and tint backgrounds. Deliberately
# a bold, high-contrast palette (deep violet, emerald, hot magenta, amber,
# fuchsia, burnt orange) with maximum hue distance from Certe's own muted
# blue-grey/olive/dusty-rose/mustard/lavender house style - not a close
# cousin of it, so nobody mistakes a stranger's default clone of this
# repository for a real Certe instance at a glance. An actual Certe
# instance gets its real colours from certestyle when installed (see
# episode_palette_from_certestyle()), not from these shipped defaults.
blue: "#5B21B6"
blue_dark: "#3B0F80"
blue_light: "#8B5CF6"
blue_pale: "#C4B5FD"
blue_paler: "#E4DAFB"
blue_palest: "#F3EEFE"
blue_faintest: "#FAF8FF"
green: "#059669"
green_dark: "#065F46"
green_pale: "#6EE7B7"
green_palest: "#ECFDF5"
pink: "#DB2777"
pink_dark: "#9D174D"
pink_pale: "#F9A8D4"
pink_palest: "#FCE7F3"
yellow: "#F59E0B"
yellow_dark: "#B45309"
yellow_pale: "#FCD34D"
yellow_palest: "#FFFBEB"
lilac: "#C026D3"
lilac_dark: "#86198F"
lilac_pale: "#F0ABFC"
brown: "#EA580C"
brown_dark: "#9A3412"
white: "#FFFFFF"
