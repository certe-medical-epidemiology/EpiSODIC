# EpiSODE's shipped default UI palette.
#
# Deliberately a separate file from default.yaml: this is a display-only
# concern (the app's colours), not part of detection configuration, so it
# must never affect episode_config_hash()/config_snapshot (ARCHITECTURE.md
# section 7.4-7.5's reproducibility guarantee is about detection results,
# not colour swatches). Resolved the same way: this file's values are the
# defaults, an operator overrides them by pointing EPISODE_PALETTE_CONFIG
# at their own YAML with only the keys they want to change - any
# organisation runs EpiSODE in its own house colours this way, without
# EpiSODE ever shipping (or depending on) any specific organisation's
# house-style package.
#
# Named by role (Bootstrap-style), not by raw hue word - a config key
# should say what a colour is *for*, not what it looks like.
#
# Neutrals: text, borders and backgrounds are their own true grey scale,
# independent of whichever hue is "primary" - so body text is never
# tinted by the brand colour (this used to derive "ink" etc. straight
# from the primary hue's own dark step, which looked fine when primary
# happened to be a muted blue-grey but became visibly wrong the moment
# primary became a saturated colour: every letter of body text was
# rendered in it).
ink: "#1F2430"
muted: "#5B6472"
faint: "#9AA3B2"
border: "#D8DCE3"
bg_subtle: "#EEF0F4"
bg: "#F7F8FA"
surface: "#FFFFFF"

# Brand / semantic roles. Deliberately a bold, high-contrast set with
# maximum hue distance from Certe's own muted house style, so a
# stranger's default clone of this repository is unmistakably not a real
# Certe instance at a glance - primary is a calm forest green rather than
# Certe's blue-grey (a first attempt used violet, which read as far too
# heavy for a header/primary colour; green sits easier on the eye at that
# size while staying just as clearly distinct).
primary: "#2E8B57"
primary_dark: "#1F5C3A"
primary_light: "#4FAE7C"
primary_tint: "#DCF3E7"

secondary: "#7C3AED"
secondary_dark: "#5B21B6"

tertiary: "#C2703D"
tertiary_dark: "#8A4B24"

success: "#0E8074"
success_dark: "#0B5C54"

warning: "#D9971F"
warning_dark: "#A66B12"

danger: "#C23B72"
danger_dark: "#8A2851"
