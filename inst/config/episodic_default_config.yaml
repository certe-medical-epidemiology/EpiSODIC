# EpiSODIC shipped defaults.
# See vignette("tuning-detection") for what each key does, its trade-offs,
# and the complete reference table.

# Reconciliation.
reconciliation:
  case_free_days_default: 14
  close_after_runs: 14
  cooldown_reopen_ratio: 1.5
  stale_open_days: 60
  autoclose_unassessed: true

# Eligibility.
eligibility:
  min_baseline_weeks: 52
  min_median_weekly_count: 1
  min_nonzero_week_share: 0.2

# Effect-size floor.
effect_size_floor:
  min_excess_over_upperbound: 3
  min_ratio_observed_expected: 1.5

# same_place detector.
same_place:
  enabled: true
  default_n_cases: 3
  default_k_days: 14
  lookback_days: 90
  overrides:
    Clostridioides difficile: {n_cases: 3, k_days: 14}
    MRSA: {n_cases: 3, k_days: 14}
    VRE: {n_cases: 3, k_days: 14}
    Carbapenemase-producing Enterobacterales: {n_cases: 2, k_days: 14}
    Norovirus: {n_cases: 3, k_days: 7}
    Legionella: {n_cases: 2, k_days: 14}

# Farrington detector.
farrington:
  enabled: true
  aggregation: week
  b: 2
  w: 3
  reweight: true
  weightsThreshold: 2.58
  trend: true
  pastWeeksNotIncluded: 26
  limit54: [5, 4]
  alpha: 0.05
  max_weeks_tested: 8

# MEM detector.
mem:
  enabled: true
  min_seasons: 2
  levels:
    - pathogen_province
    - pathogen_region
  min_climatology_years: 3
  climatology_smooth_weeks: 5
  trough_percentile: 0.25
  seasonality_peak_weeks: 8
  seasonality_min_peak_share: 0.40

# rare_trigger detector.
rare_trigger:
  enabled: true
  pathogens:
    - Neisseria meningitidis
    - Corynebacterium diphtheriae
    - Carbapenemase-producing Enterobacterales
    - Candida auris
  min_cases: 1
  lookback_days: 90

# Priority score.
priority_score:
  weights:
    excess_component: 0.25
    ratio_component: 0.15
    severity_component: 0.20
    growth_component: 0.15
    agreement_component: 0.10
    density_component: 0.10
    spatial_component: 0.05

# Scale.
scale:
  epidemic_levels:
    - pathogen_province
    - pathogen_region

# Geography.
geography:
  region_code: REGION
  area_code_prefix: "AREA-"
  area_pc_characters: 2

# Report.
report:
  small_count_threshold: 5
  output_dir: ~

# Notifications. See vignette("notifications") for setup.
notifications: ~

# Suppression.
suppression:
  child_dominance_threshold: 0.70
  parent_diffuse_threshold: 0.50
  parent_min_flagged_children: 2

# Access.
access:
  require_login: false
