# EpiSODIC shipped defaults.
#
# This file is software: documented defaults shipped with the package. It is
# NOT instance configuration. An operator's actual instance configuration
# lives outside this repository and is located through the EPISODIC_CONFIG
# environment variable; it is loaded on top of this file, and any key it
# sets overrides the corresponding key here. The resolved (merged) result
# is what gets hashed into config_hash and stored in config_snapshot on
# every run - see episodic_config_resolve().

# Reconciliation.
reconciliation:
  case_free_days_default: 14   # fallback when a pathogen has no override
  close_after_runs: 14         # consecutive runs with no new case before an unconfirmed cluster auto-closes (never for a confirmed outbreak)
  cooldown_reopen_ratio: 1.5   # escape hatch ("half again"): a cool-down absorption at least this many times the cluster's size flags it for reassessment instead of being silently absorbed; NA disables this
  stale_open_days: 60          # force-closes any still-unassessed cluster this many days since its last case, regardless of close_after_runs - catches backfilled clusters that would otherwise never age out

# Eligibility gate: a stream must clear all three thresholds before the
# statistical detectors (Farrington/MEM) run against it at all; a stream
# that fails still runs through same_place and rare_trigger. Values are
# provisional; calibrate against real signal volume once an instance has
# accrued history.
eligibility:
  min_baseline_weeks: 52        # weeks of case history required before detection is attempted at all
  min_median_weekly_count: 1    # median weekly case count over that baseline window must reach this
  min_nonzero_week_share: 0.2   # share of baseline weeks with at least one case must reach this

# Effect-size floor: an extra gate on top of the detector's own
# significance test, applied only when opening a NEW cluster (a match
# against an already-open cluster is always merged regardless). A signal
# must clear both floors that are set; either left NA never blocks.
effect_size_floor:
  min_excess_over_upperbound: 3    # cases observed above Farrington's own statistical upper bound
  min_ratio_observed_expected: 1.5 # observed/expected ratio required

# same_place rule-based detector.
# Defaults of n = 3 within 14 days, tightened per pathogen for the ones
# that matter. Keys are raw `pathogen` strings, matching
# inst/config/pathogen_config.csv and whatever the operator's lab feed uses.
same_place:
  # NOTE: keys are n_cases/k_days rather than the more conventional "n"
  # because YAML 1.1 parses a bare unquoted `n:` key as the boolean FALSE
  # (the classic Norway-problem gotcha). n_cases means the same thing.
  default_n_cases: 3
  default_k_days: 14
  overrides:
    Clostridioides difficile: {n_cases: 3, k_days: 14}
    MRSA: {n_cases: 3, k_days: 14}
    VRE: {n_cases: 3, k_days: 14}
    Carbapenemase-producing Enterobacterales: {n_cases: 2, k_days: 14}
    Norovirus: {n_cases: 3, k_days: 7}
    Legionella: {n_cases: 2, k_days: 14}

# Farrington detector (surveillance::farringtonFlexible()).
farrington:
  aggregation: week        # cases are aggregated to weekly counts before fitting
  b: 2                     # number of years of history to compare against.
                            # The detector needs (b + 1) * 52 weeks before it
                            # will fit at all, so this is not a free dial: at
                            # b: 3 a stream needs four years of history, which
                            # silently switched Farrington off entirely for an
                            # instance carrying two. A run now says so out
                            # loud when it happens. Raise this as history
                            # accrues - 5 is the conventional choice - and the
                            # detector starts fitting again by itself.
  w: 3                     # half-window (weeks) around the same calendar week in each reference year
  reweight: true           # down-weight past outbreak weeks (by Anscombe residual) when re-estimating the baseline, so an old outbreak doesn't inflate future thresholds
  weightsThreshold: 2.58   # Anscombe-residual cutoff above which a past week is down-weighted by `reweight`
  trend: true              # allow a linear trend term in the baseline model, when significant
  pastWeeksNotIncluded: 26 # exclude the trailing window from the noise-level estimate (surveillance default guidance)
  limit54: [5, 4]          # noPeriods-style low-count safeguard: [cases, period_weeks]
  alpha: 0.05              # significance level for the upper bound; lower = wider bound = fewer alarms, higher = narrower = more alarms
  # How many trailing weeks one run may test. A nightly run tests the one
  # week that just became testable; a run after a gap tests every week
  # since the last completed run, so an outage does not leave weeks that
  # nothing ever looked at. This caps that catch-up - and caps a first run
  # against a backfilled history, which would otherwise open a dossier for
  # every alarming week in the archive.
  max_weeks_tested: 8

# MEM seasonal detector (mem::memmodel()), for pathogens flagged
# mem_applicable in pathogen_config.csv.
mem:
  min_seasons: 2   # fully-observed prior seasons required before MEM fits
                   # at all. The same "need real baseline history first"
                   # dial as farrington.b, and with the same consequence if
                   # set beyond what an instance carries: MEM says nothing.
                   # Two is the practical floor; more prior seasons give a
                   # steadier pre-epidemic threshold, so raise this as
                   # history accrues.

# rare_trigger: a curated absolute-rarity list. A single case of any
# pathogen listed here fires a detection; no baseline is computed at all.
# Match is against the raw `pathogen` string, case-insensitively.
#
# Deliberately excludes Bordetella pertussis, an otherwise plausible
# candidate: it is also rt_applicable in pathogen_config.csv (endemic,
# seasonal, tracked via Rt/Farrington), and
# putting it on both lists means every sporadic case fires rare_trigger
# redundantly with what the statistical detectors already cover. A pathogen
# belongs here when a single case is ALWAYS notable regardless of context
# (no meaningful "expected baseline" exists for it at all), not merely when
# it is serious.
rare_trigger:
  pathogens:
    - Neisseria meningitidis
    - Corynebacterium diphtheriae
    - Carbapenemase-producing Enterobacterales
    - Candida auris
  min_cases: 1   # cases required in the window to fire; almost always 1, since a pathogen only belongs on this list if a single case is already notable

# Priority score weights. Sum to 1.00. Each component is independently
# rescaled/clamped before being combined as a weighted mean; a component
# that cannot be computed for a given cluster (e.g. no patient-day
# denominator) drops out and the remaining weights renormalise, rather
# than being scored as 0.
priority_score:
  weights:
    excess_component: 0.25     # magnitude of cases above the model's own upper bound
    ratio_component: 0.15      # how far observed/expected exceeds 1 (capped at ratio 5)
    severity_component: 0.20   # the pathogen's configured clinical severity weight (pathogen_config.csv), independent of case counts
    growth_component: 0.15     # whether the cluster is accelerating (slope of case counts over the last 3 periods)
    agreement_component: 0.10  # share of the 4 detectors that fired on this cluster
    density_component: 0.10    # incidence per 1,000 patient-days versus that stream's own baseline density
    spatial_component: 0.05    # how concentrated cases are in one location versus spread across several

# Notifications: not configured by default. Set in the instance
# configuration file (EPISODIC_CONFIG) to enable. This key is excluded
# from config_hash so notification settings never alter detection
# reproducibility and secrets never reach config_snapshot.
#
# Supported channels: ntfy, SMTP, sendmail, Microsoft 365, Teams, Slack.
# See vignette("notifications") for the full setup guide per channel.
#
# Minimal example (ntfy):
#
# notifications:
#   enabled: true
#   dashboard_url: "https://episodic.example.org"  # optional
#   triggers:
#     new_clusters: true
#     run_failure: true
#   channels:
#     ntfy:
#       enabled: true
#       server: "https://ntfy.sh"
#       topic: "my-episodic-alerts"
notifications: ~

# Lattice suppression: collapses one real outbreak seen at several
# lattice levels at once (e.g. a ward outbreak is also statistically
# visible at its institution) into a single dossier, instead of opening
# a redundant one per level. Evaluated per pathogen against three
# parent/child pairs: ward<->institution, area<->province,
# province<->region. See R/reconcile_suppress.R for the full mechanism.
# Suppressed clusters are never deleted, only hidden behind the cluster
# that suppressed them; a cluster a human has already assessed is never
# suppressed regardless of these thresholds.
suppression:
  # If one child-level cluster accounts for at least this share of its
  # parent's cases (actual case overlap, not cluster size), the rise is
  # local: the child wins and the parent cluster is suppressed.
  child_dominance_threshold: 0.70
  # If none of the parent's overlapping children individually reach this
  # share of the parent's cases, the rise counts as spread across them
  # rather than concentrated in one - a candidate for the diffuse rule
  # below (only fires once parent_min_flagged_children is also met).
  parent_diffuse_threshold: 0.50
  # Minimum number of overlapping child clusters required before the
  # diffuse rule can suppress them in favour of the parent.
  parent_min_flagged_children: 2
